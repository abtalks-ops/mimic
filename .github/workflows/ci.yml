name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Skips cleanly until application code (package.json) exists.
      - name: Install
        if: hashFiles('package.json') != ''
        run: npm ci
      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run lint
      - name: Typecheck
        if: hashFiles('package.json') != ''
        run: npm run typecheck
      - name: Unit tests
        if: hashFiles('package.json') != ''
        run: npm test -- --run
      - name: Build
        if: hashFiles('package.json') != ''
        run: npm run build
