name: Deploy test build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Self-host the model files (ADR-0007): copy them from Hugging Face into the site
      # at build time, so phones never contact Hugging Face.
      - uses: actions/cache@v4
        with:
          path: public/models
          key: models-${{ hashFiles('scripts/fetch-models.mjs') }}
      - run: node scripts/fetch-models.mjs public/models
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SELF_HOSTED_MODELS: '1'
      - name: Check no Hugging Face URLs are used at runtime
        run: |
          if grep -rl "huggingface.co/rhasspy" dist/assets; then echo "Piper still points at Hugging Face"; exit 1; fi
          du -sh dist dist/models
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
